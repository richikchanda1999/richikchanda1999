name: generate-resume

on:
  push:
    paths:
      - 'resume/resume.typ'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true
    
jobs:
  install-typst:
    name: Install Typst and Cargo
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Typst (Pre-built)
        uses: typst-community/setup-typst@v3

      - name: Install Typst
        run: cargo install --locked typst-cli

      - name: Compile PDF
        run: typst compile ./resume/resume.typ ./resume/Richik_Chanda_Resume.pdf

      - name: Prepare for Deployment
        run: |
          mkdir public
          mv Richik_Chanda_Resume.pdf public/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  